<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0b141a;
      color: #e9edef;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    header {
      background-color: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a3942;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h3 {
      margin: 0;
      font-size: 15px;
      color: #e9edef;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      transition: background-color 0.3s;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #8696a0;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      transition: background-color 0.2s, color 0.2s;
    }

    .icon-btn:hover {
      background-color: #2a3942;
      color: #e9edef;
    }

    .clear-btn:hover {
      color: #ef4444;
    }

    .ws-bar {
      background-color: #111b21;
      padding: 8px 12px;
      border-bottom: 1px solid #2a3942;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #8696a0;
    }

    .ws-status-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .ws-status-text .status-label {
      color: #e9edef;
    }

    .ws-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-small {
      background-color: #2a3942;
      color: #e9edef;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-small:hover {
      background-color: #3b4a54;
    }

    .ws-error-banner {
      display: none;
      background-color: #3c1214;
      border-bottom: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 6px 12px;
      font-size: 11px;
      line-height: 1.3;
      word-break: break-word;
    }

    .ws-error-banner.visible {
      display: block;
    }

    .config-panel {
      display: none;
      background-color: #182229;
      padding: 10px 12px;
      border-bottom: 1px solid #2a3942;
      gap: 8px;
      flex-direction: column;
    }

    .config-panel.open {
      display: flex;
    }

    .config-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .config-group label {
      font-size: 10px;
      color: #8696a0;
      text-transform: uppercase;
    }

    .config-input {
      background-color: #2a3942;
      color: #e9edef;
      border: 1px solid #3b4a54;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
    }

    .config-input:focus {
      border-color: #00a884;
    }

    .btn-save {
      background-color: #00a884;
      color: #111b21;
      font-weight: 600;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      align-self: flex-end;
      transition: background-color 0.2s;
    }

    .btn-save:hover {
      background-color: #029071;
    }

    #chat-container {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-image: radial-gradient(#1f2c34 1px, transparent 0);
      background-size: 16px 16px;
    }

    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 0.5px rgba(11,20,26,0.13);
    }

    .message.user {
      align-self: flex-end;
      background-color: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0;
    }

    .message.gemini {
      align-self: flex-start;
      background-color: #202c33;
      color: #e9edef;
      border-top-left-radius: 0;
    }

    .sender-label {
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 3px;
      color: #8696a0;
    }

    .message.user .sender-label {
      color: #53bdeb;
      text-align: right;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background-color: #202c33;
      border-top: 1px solid #2a3942;
    }

    #chat-input {
      flex: 1;
      background-color: #2a3942;
      color: #e9edef;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13.5px;
      outline: none;
    }

    #chat-input::placeholder {
      color: #8696a0;
    }

    #send-btn {
      background-color: #00a884;
      color: #111b21;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #send-btn:hover {
      background-color: #029071;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-info">
      <div class="status-dot" id="status-dot"></div>
      <h3>Gemini Live Stream</h3>
    </div>
    <div class="header-actions">
      <button id="toggle-config-btn" class="icon-btn" title="Configuración de Servidor">⚙️</button>
      <button id="clear-btn" class="icon-btn clear-btn" title="Limpiar chat">Limpiar</button>
    </div>
  </header>

  <div class="ws-bar">
    <div class="ws-status-text">
      <span>WS:</span>
      <span id="ws-status-label" class="status-label">Desconectado</span>
    </div>
    <div class="ws-actions">
      <button id="reconnect-btn" class="btn-small">Reconectar</button>
    </div>
  </div>

  <div id="ws-error-banner" class="ws-error-banner"></div>

  <div id="config-panel" class="config-panel">
    <div class="config-row">
      <div class="config-group" style="flex: 2;">
        <label for="ws-host-input">Host IP</label>
        <input type="text" id="ws-host-input" class="config-input" placeholder="0.0.0.0" value="0.0.0.0" />
      </div>
      <div class="config-group" style="flex: 1;">
        <label for="ws-port-input">Puerto</label>
        <input type="text" id="ws-port-input" class="config-input" placeholder="8765" value="8765" />
      </div>
    </div>
    <button id="save-config-btn" class="btn-save">Guardar cambios</button>
  </div>

  <div id="chat-container"></div>
  
  <div class="input-container">
    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." autocomplete="off" />
    <button id="send-btn">Enviar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
